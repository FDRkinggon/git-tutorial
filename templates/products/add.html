{% extends "base.html" %}
{% block title %}Nouveau produit - FacturePro{% endblock %}

{% block content %}
<h1 class="mb-4">Nouveau produit/service</h1>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Nom *</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="price" class="form-label">Prix HT *</label>
                        <input type="number" step="0.01" class="form-control" id="price" name="price" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="tva_rate" class="form-label">Taux TVA (%)</label>
                        <select class="form-select" id="tva_rate" name="tva_rate">
                            <option value="0">0%</option>
                            <option value="5.5">5.5%</option>
                            <option value="10">10%</option>
                            <option value="20" selected>20%</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="unit" class="form-label">Unité</label>
                        <select class="form-select" id="unit" name="unit">
                            <option value="unité">Unité</option>
                            <option value="heure">Heure</option>
                            <option value="jour">Jour</option>
                            <option value="mois">Mois</option>
                            <option value="kg">Kilogramme</option>
                            <option value="m²">Mètre carré</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Enregistrer
                </button>
                <a href="{{ url_for('main.products') }}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
